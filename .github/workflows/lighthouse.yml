name: lighthouse

# Placeholder workflow — wires up once kiruk-web and kiruk-portal have real builds.
# Governed by openspec/specs/tech-stack/spec.md → "Performance budgets per route".

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/kiruk-web/**'
      - 'apps/kiruk-portal/**'
      - 'packages/design-system/**'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    if: false # disabled until apps have real builds; flip to true after wire-lighthouse-ci proposal
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
