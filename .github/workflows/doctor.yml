name: doctor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly devlog cadence + repo health probe (Sundays 06:00 UTC)
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  health:
    name: Repo health check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run doctor
        run: pnpm doctor
        continue-on-error: ${{ github.event_name == 'schedule' }}
