name: design-tokens

on:
  push:
    branches: [main]
    paths:
      - 'packages/design-system/tokens/**'
      - 'packages/design-system/style-dictionary.*'
      - 'scripts/build-tokens.mjs'
      - '.github/workflows/tokens.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/design-system/tokens/**'
      - 'packages/design-system/style-dictionary.*'
      - 'scripts/build-tokens.mjs'

permissions:
  contents: read

jobs:
  build:
    name: Build design tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build tokens
        run: pnpm tokens:build

      - name: Confirm generated output exists
        run: |
          set -e
          test -d packages/design-system/build || (echo "no build/ dir produced" && exit 1)
          echo "Generated artifacts:"
          ls -la packages/design-system/build
