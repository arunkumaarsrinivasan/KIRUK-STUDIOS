<?xml version="1.0" encoding="UTF-8"?>
<!-- kiruk HERO eye — the studio's reactive gaze. AI/code-authored per FOUNDER_DECISIONS AG1 (2026-06-01).
     Detailed sketch eye: lids + crease + lashes + tear-duct + striated iris + doodle sparks.
     LIVING SKETCH: the #kiruk-boil turbulence filter makes the linework wobble like hand-drawn
     animation; .hero-iris-spin slowly turns the iris striations. Code (ReactiveEye.tsx) drives the
     rest: #pupil gaze-tracks + dilates, #iris + #sparks recolour by inferred emotion, #sparks grow
     with engagement, #lid blinks. Canvas 200x200, centre 100,98. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     data-eye-cx="100" data-eye-cy="98" data-eye-travel="11"
     role="img" aria-label="kiruk eye" style="overflow:visible">
  <defs>
    <filter id="kiruk-boil" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="4" result="n">
        <animate attributeName="seed" values="4;9;14;6;4" dur="0.75s" repeatCount="indefinite" calcMode="discrete"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- #sparks — founder-style doodles; code grows + rotates + recolours with engagement -->
  <g id="sparks" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 40 l2.6 8.4 l8.4 2.6 l-8.4 2.6 l-2.6 8.4 l-2.6 -8.4 l-8.4 -2.6 l8.4 -2.6 Z"/>
    <path d="M150 38 q7 0 7 7 q0 6 -6 6 q-4.5 0 -4.5 -4.5"/>
    <circle cx="42" cy="146" r="3.4"/><circle cx="42" cy="146" r="1.2" fill="#0a0a0a" stroke="none"/>
    <path d="M156 142 q5 4 4 11 M163 138 l7 -3"/>
    <path d="M26 96 q-7 2 -10 0 M174 96 q7 2 10 0" stroke-width="1.4" opacity="0.8"/>
  </g>

  <!-- boiled sketch linework (lids / crease / lashes / iris) -->
  <g filter="url(#kiruk-boil)">
    <path d="M16 100 Q60 32 100 30 Q150 30 184 96 Q150 158 100 162 Q56 158 16 100 Z"
          fill="#ffffff" stroke="none"/>
    <path d="M16 100 Q60 32 100 30 Q150 30 184 96" fill="none" stroke="#0a0a0a" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M22 98 Q60 36 100 34 Q146 34 178 95" fill="none" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>
    <path d="M16 100 Q56 156 100 160 Q150 156 184 96" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M30 78 Q100 36 172 72" fill="none" stroke="#0a0a0a" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    <path d="M180 78 l13 -7 M170 62 l10 -8 M156 50 l7 -9 M140 42 l4 -9"
          fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M16 100 q-7 1 -10 5" fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
    <g id="iris" fill="none" stroke="#0a0a0a">
      <circle cx="100" cy="98" r="40" stroke-width="3.2"/>
      <circle cx="100" cy="98" r="26" stroke-width="1.4" opacity="0.6"/>
      <g class="hero-iris-spin" style="transform-box:fill-box;transform-origin:center" stroke-width="1.3" stroke-linecap="round" opacity="0.5">
        <line x1="127" y1="98" x2="138" y2="98"/><line x1="123.38" y1="111.5" x2="132.9" y2="117"/>
        <line x1="113.5" y1="121.38" x2="119" y2="130.9"/><line x1="100" y1="125" x2="100" y2="136"/>
        <line x1="86.5" y1="121.38" x2="81" y2="130.9"/><line x1="76.62" y1="111.5" x2="67.1" y2="117"/>
        <line x1="73" y1="98" x2="62" y2="98"/><line x1="76.62" y1="84.5" x2="67.1" y2="79"/>
        <line x1="86.5" y1="74.62" x2="81" y2="65.1"/><line x1="100" y1="71" x2="100" y2="60"/>
        <line x1="113.5" y1="74.62" x2="119" y2="65.1"/><line x1="123.38" y1="84.5" x2="132.9" y2="79"/>
      </g>
    </g>
  </g>

  <!-- #pupil — gaze-tracks + dilates (code-driven, kept crisp outside the boil) -->
  <g id="pupil" fill="#0a0a0a">
    <circle cx="100" cy="98" r="13"/>
    <circle cx="105" cy="92" r="3.6" fill="#ffffff" opacity="0.95"/>
    <circle cx="95" cy="103" r="1.6" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- #lid — blink (code squashes from the top) -->
  <g id="lid" transform="translate(0 31) scale(1 0) translate(0 -31)">
    <path d="M16 100 Q60 32 100 30 Q150 30 184 96 Q150 158 100 162 Q56 158 16 100 Z" fill="#ffffff" stroke="none"/>
    <path d="M16 100 Q60 32 100 30 Q150 30 184 96" fill="none" stroke="#0a0a0a" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M180 78 l13 -7 M170 62 l10 -8 M156 50 l7 -9" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
