<?xml version="1.0" encoding="UTF-8"?>
<!--
  kiruk SMALL eye rig — for chrome eyes (progress, next/back, done, header).
  Draw ONE distinct small eye per variant. You only ever draw the OPEN eye — code handles
  closed / blink / pupil-dart / dilate / breathing. Neutral BLACK & WHITE only (no colour;
  only the hero eye carries emotion colour).

  HOW TO USE (Figma + tablet):
   1. Import this file. Draw on the named layers, keep the names:
        eye    — the eyeball: shape/outline + iris motif (make each variant DIFFERENT)
        pupil  — the pupil, CENTRED on the crosshair, its own group (code moves it)
        lid    — optional top lid for blink (else code squashes)
   2. Canvas 48×48, centre/pupil = (24,24). Keep the iris within the dashed ring (~r14).
   3. Hide/delete the "guides" layer. Export SVG with "Include id attribute" ON.
   4. Save each variant to apps/kiruk-portal/public/eye/glyphs/<name>.svg
        e.g. ring.svg, solid.svg, slit.svg, portal.svg, hatch.svg, star.svg, constellation.svg
   5. Code maps each onboarding step / control to a variant filename.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     data-eye-cx="24" data-eye-cy="24" data-eye-travel="3.5">

  <g id="eye" fill="#ffffff" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- eyeball shape + iris motif — make this DIFFERENT per variant -->
  </g>

  <g id="pupil" fill="#0a0a0a">
    <!-- pupil, CENTRED on the crosshair, own group -->
  </g>

  <g id="lid" fill="#ffffff" stroke="#0a0a0a" stroke-width="2">
    <!-- optional top lid for blink -->
  </g>

  <!-- guides — HIDE / DELETE before export -->
  <g id="guides" stroke="#18E0FF" stroke-width="0.5" fill="none" opacity="0.85">
    <line x1="20" y1="24" x2="28" y2="24" />
    <line x1="24" y1="20" x2="24" y2="28" />
    <circle cx="24" cy="24" r="3.5" stroke-dasharray="1 2" />
    <circle cx="24" cy="24" r="14" stroke-dasharray="2 2" />
    <circle cx="24" cy="24" r="22" stroke-dasharray="1 3" opacity="0.5" />
  </g>
</svg>
